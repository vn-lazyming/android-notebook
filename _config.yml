title: Android Notebook
description: How Android actually works, checked on a real production phone.
remote_theme: just-the-docs/just-the-docs

color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3

heading_anchors: true

aux_links:
  GitHub: https://github.com/vn-lazyming/android-notebook
aux_links_new_tab: true

# callouts — the thing this notebook needs most
callouts_level: quiet
callouts:
  trap:
    title: Trap
    color: red
  verify:
    title: Verify
    color: green
  note:
    title: Note
    color: blue

back_to_top: true
back_to_top_text: "back to top"

footer_content: 'SM-S942B · S942BXXS4AZG5 · Android 16 — every claim here has a command that checks it.'

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
